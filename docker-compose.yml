version: '3.8'

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: omnivoice_gateway
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./gateway:/app/gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
