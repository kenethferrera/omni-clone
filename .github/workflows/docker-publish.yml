name: Build and Push Serverless Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/omnivoice-serverless

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: gpu_pod/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/omnivoice-serverless:latest
            ghcr.io/${{ github.repository_owner }}/omnivoice-serverless:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
